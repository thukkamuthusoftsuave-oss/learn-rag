[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-policy-assistant"
version = "2.0.0"
description = "Enterprise HR-207 Policy Assistant: Modern Next.js + Python Architecture with Hybrid Retrieval, Autonomous Agents, and 4-Layer Security."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index",
    "llama-index-vector-stores-chroma",
    "llama-index-embeddings-huggingface",
    "rank-bm25",
    "chromadb",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "scikit-learn",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["application*", "curriculum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
