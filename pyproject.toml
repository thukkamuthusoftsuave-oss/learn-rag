[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rag"
version = "1.0.0"
description = "HR-207 policy assistant: retrieval-augmented answers with citations, hybrid retrieval and trace-driven evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index",
    "llama-index-vector-stores-chroma",
    "llama-index-embeddings-huggingface",
    "llama-index-llms-gemini",
    "llama-index-retrievers-bm25",
    "rank-bm25",
    "chromadb",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
policy-rag = "policy_rag.cli:main"

[tool.setuptools.packages.find]
include = ["policy_rag*"]

[tool.setuptools.package-data]
policy_rag = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
